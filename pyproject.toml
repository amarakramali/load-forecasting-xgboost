[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aep-load-forecasting"
version = "0.1.0"
description = "Reproducible AEP electricity-load forecasting with XGBoost"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Amar Akram" },
]
keywords = ["energy", "forecasting", "time-series", "xgboost"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "joblib>=1.3",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "streamlit>=1.30",
    "xgboost>=2.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "ruff==0.16.0",
]

[project.scripts]
aep-demo = "aep_load_forecasting.demo_pipeline:main"
aep-sample-data = "aep_load_forecasting.sample_data:main"
aep-make-features = "aep_load_forecasting.make_features:main"
aep-baseline-eval = "aep_load_forecasting.baseline_eval:main"
aep-xgb-eval = "aep_load_forecasting.xgb_eval:main"
aep-forecast = "aep_load_forecasting.forecast_24h:main"

[project.urls]
Homepage = "https://github.com/amarakramali/load-forecasting-xgboost"
Issues = "https://github.com/amarakramali/load-forecasting-xgboost/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
