name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev]"

      - name: Lint Python sources
        run: python -m ruff check src tests streamlit_app.py

      - name: Run tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q src tests streamlit_app.py

      - name: Build wheel and source distribution
        run: python -m build

      - name: Verify wheel package layout
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel, = glob.glob("dist/*.whl")
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())

          assert "aep_load_forecasting/__init__.py" in names
          assert "src/__init__.py" not in names
          PY

      - name: Smoke-test installed console commands
        run: |
          aep-demo --help
          aep-sample-data --help
          aep-make-features --help
          aep-baseline-eval --help
          aep-xgb-eval --help
          aep-forecast --help
